<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="Elite Showcase ID">
  <!--
    Elite Showcase ID — Primary Logo (Dark / Navy background)
    Colors: White · Electric Blue #4D9FFF (lightened for dark bg)
  -->
  <title>Elite Showcase ID</title>

  <!-- Background -->
  <rect width="520" height="120" fill="#0d1829"/>

  <!-- Triple-chevron mark -->
  <polyline points="10,18 42,60 10,102"
    fill="none" stroke="#ffffff" stroke-width="9"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>
  <polyline points="34,10 74,60 34,110"
    fill="none" stroke="#ffffff" stroke-width="10"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <polyline points="58,18 102,60 58,102"
    fill="none" stroke="#4d9fff" stroke-width="11"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="128" y="52"
    font-family="'Barlow Condensed', 'DIN Condensed', 'DIN Condensed Bold', 'Arial Narrow', Impact, sans-serif"
    font-weight="800" font-size="34" letter-spacing="2"
    fill="#ffffff">ELITE SHOWCASE</text>

  <line x1="128" y1="59" x2="516" y2="59"
    stroke="rgba(255,255,255,0.12)" stroke-width="0.75"/>

  <text x="128" y="108"
    font-family="'Barlow Condensed', 'DIN Condensed', 'DIN Condensed Bold', 'Arial Narrow', Impact, sans-serif"
    font-weight="800" font-size="52" letter-spacing="4"
    fill="#4d9fff">ID</text>
</svg>
